[project]
name = "video-upscaler"
version = "0.1.0"
description = "NVIDIA/FFmpeg video upscaler with a Tkinter UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "onnxruntime-directml>=1.17",
]

[project.scripts]
upscaler = "upscaler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["upscaler"]
